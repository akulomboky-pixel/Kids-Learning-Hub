<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#FFF4D6">

    <title>Tebak Pola - Petualangan Otak</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <!-- HEADER -->
        <header class="top-bar">

            <a href="../index.html" class="home-btn">
                🏠
            </a>

            <div class="title-area">
                <h1>🧠 Tebak Pola</h1>
                <p>Perhatikan polanya!</p>
            </div>

            <div class="score-box">
                ⭐ <span id="score">0</span>
            </div>

        </header>


        <!-- PROGRESS -->
        <div class="progress-area">

            <div class="progress-text">
                Soal <span id="questionNumber">1</span>
                dari
                <span id="totalQuestions">10</span>
            </div>

            <div class="progress-track">
                <div id="progressBar"></div>
            </div>

        </div>


        <!-- INSTRUCTION -->
        <section class="question-area">

            <h2>
                Bentuk apa yang berikutnya?
            </h2>

            <p id="hint">
                Perhatikan urutan bentuk di bawah.
            </p>

        </section>


        <!-- PATTERN -->
        <section
            id="pattern"
            class="pattern"
            aria-label="Pola"
        >
        </section>


        <!-- ANSWERS -->
        <section class="answer-section">

            <h3>Pilih jawaban:</h3>

            <div
                id="answers"
                class="answers"
            >
            </div>

        </section>


        <!-- FEEDBACK -->
        <div
            id="feedback"
            class="feedback"
            aria-live="polite"
        >
        </div>


        <!-- NEXT BUTTON -->
        <button
            id="nextButton"
            class="next-btn hidden"
        >
            Soal Berikutnya ➜
        </button>


        <!-- RESULT -->
        <section
            id="result"
            class="result hidden"
        >

            <div class="result-emoji">
                🏆
            </div>

            <h2>Hebat!</h2>

            <p>Kamu sudah menyelesaikan semua soal.</p>

            <div class="final-score">
                ⭐ <span id="finalScore">0</span> / 10
            </div>

            <p id="bestScoreText"></p>

            <button
                id="restartButton"
                class="restart-btn"
            >
                🔄 Main Lagi
            </button>

            <a
                href="../index.html"
                class="home-result"
            >
                🏠 Kembali ke Menu
            </a>

        </section>

    </main>


    <script src="game.js"></script>

</body>
</html>
